name: CI & Release

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: server

jobs:
  # ---------------------------------------------------------------------------
  # Go server gates
  # ---------------------------------------------------------------------------
  sqlc-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: server/go.sum
      - uses: sqlc-dev/setup-sqlc@v5
        with:
          sqlc-version: '1.31.1'
      - name: Verify sqlc generated code is up to date
        run: |
          sqlc generate
          git diff --exit-code -- 'repositories/db/*.go'

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: server/go.sum
      - uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          working-directory: server
          args: --timeout=5m

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: server/go.sum
      - name: Run tests
        run: go test -v -count=1 ./pkg/ ./middlewares/ ./services/ ./controllers/api/v1/

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: server/go.sum
      - name: Build
        run: go build -v ./...

  # ---------------------------------------------------------------------------
  # Flutter analyse + test
  # ---------------------------------------------------------------------------
  flutter-analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Flutter prep
        uses: ./.github/actions/flutter-prep
      - name: Format check
        run: dart format --set-exit-if-changed lib test
        working-directory: app
      - name: Analyze
        run: flutter analyze
        working-directory: app
      - name: Test (no network)
        run: flutter test --coverage -x network
        working-directory: app

  # ---------------------------------------------------------------------------
  # Platform builds (all run in parallel after flutter-analyze-and-test)
  # ---------------------------------------------------------------------------
  build-android:
    needs: flutter-analyze-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Flutter prep
        uses: ./.github/actions/flutter-prep

      - name: Write Android signing config from CI secrets
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        shell: bash
        working-directory: app
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          printenv KEYSTORE_B64 | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$KS_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Write google-services.json from CI secrets
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        shell: bash
        working-directory: app
        env:
          GS_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          printenv GS_B64 | base64 -d > android/app/google-services.json

      - name: Extract App Version
        working-directory: app
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | sed 's/version: //' | tr -d '\r' | sed -E 's/\+[0-9]+$//')
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build release APKs (split per ABI)
        working-directory: app
        run: flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/symbols

      - name: Build universal release APK
        working-directory: app
        run: flutter build apk --release --obfuscate --split-debug-info=build/symbols

      - name: Upload Dart symbol files
        uses: actions/upload-artifact@v4
        with:
          name: clearwage-symbols
          path: app/build/symbols
          if-no-files-found: warn

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: clearwage-apks
          path: app/build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error

  build-ios:
    needs: flutter-analyze-and-test
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Flutter prep
        uses: ./.github/actions/flutter-prep

      - name: Write GoogleService-Info.plist from CI secrets
        if: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 != '' }}
        shell: bash
        working-directory: app
        env:
          GS_PLIST_B64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          printenv GS_PLIST_B64 | base64 -d > ios/Runner/GoogleService-Info.plist

      - name: Extract App Version
        working-directory: app
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | sed 's/version: //' | tr -d '\r' | sed -E 's/\+[0-9]+$//')
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build release iOS (unsigned)
        working-directory: app
        run: flutter build ios --release --no-codesign

      - name: Package iOS build
        working-directory: app
        run: |
          cd build/ios/iphoneos
          zip -r ../clearwage-ios-v${{ env.APP_VERSION }}.zip Runner.app
          cd ../../..

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: clearwage-ios
          path: app/build/ios/clearwage-ios-v${{ env.APP_VERSION }}.zip
          if-no-files-found: error

  build-windows:
    needs: flutter-analyze-and-test
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Flutter prep
        uses: ./.github/actions/flutter-prep

      - name: Extract App Version
        shell: bash
        working-directory: app
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | sed 's/version: //' | tr -d '\r' | sed -E 's/\+[0-9]+$//')
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build release Windows
        shell: bash
        working-directory: app
        run: flutter build windows --release

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer (Inno Setup)
        shell: powershell
        working-directory: app
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          dart run tool/build_installer.dart --iscc $iscc

      - name: Verify installer was produced
        shell: powershell
        working-directory: app
        run: |
          $exe = Get-ChildItem build/installers/clearwage_setup_*.exe
          if (-not $exe) { throw "Installer .exe was not produced" }
          Write-Host "Installer: $($exe.FullName)"

      - name: Package Windows build
        shell: powershell
        working-directory: app
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath build/clearwage-windows-v$env:APP_VERSION.zip -Force

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: clearwage-windows
          path: |
            app/build/clearwage-windows-v${{ env.APP_VERSION }}.zip
            app/build/installers/clearwage_setup_*.exe
          if-no-files-found: error

  build-macos:
    needs: flutter-analyze-and-test
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Flutter prep
        uses: ./.github/actions/flutter-prep

      - name: Write GoogleService-Info.plist from CI secrets
        if: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 != '' }}
        shell: bash
        working-directory: app
        env:
          GS_PLIST_B64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          printenv GS_PLIST_B64 | base64 -d > macos/Runner/GoogleService-Info.plist

      - name: Extract App Version
        working-directory: app
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | sed 's/version: //' | tr -d '\r' | sed -E 's/\+[0-9]+$//')
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build release macOS (unsigned)
        working-directory: app
        run: flutter build macos --release

      - name: Package macOS build
        working-directory: app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "build/macos/Build/Products/Release/clearwage.app" \
            build/macos/clearwage-macos-v${{ env.APP_VERSION }}.zip

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: clearwage-macos
          path: app/build/macos/clearwage-macos-v${{ env.APP_VERSION }}.zip
          if-no-files-found: error

  build-linux:
    needs: flutter-analyze-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build libgtk-3-dev libsecret-1-dev
      - name: Flutter prep
        uses: ./.github/actions/flutter-prep

      - name: Extract App Version
        working-directory: app
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | sed 's/version: //' | tr -d '\r' | sed -E 's/\+[0-9]+$//')
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build release Linux
        working-directory: app
        run: flutter build linux --release

      - name: Package Linux build
        working-directory: app
        run: |
          tar -czf build/clearwage-linux-v${{ env.APP_VERSION }}.tar.gz \
            -C build/linux/x64/release bundle

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: clearwage-linux
          path: app/build/clearwage-linux-v${{ env.APP_VERSION }}.tar.gz
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Release (tag push only)
  # ---------------------------------------------------------------------------
  release:
    needs:
      - sqlc-check
      - lint
      - test
      - build
      - flutter-analyze-and-test
      - build-android
      - build-ios
      - build-windows
      - build-macos
      - build-linux
    # Android is required for a release; other platforms are best-effort.
    if: startsWith(github.ref, 'refs/tags/v') &&
        !cancelled() &&
        needs.build-android.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download APK artifacts
        if: needs.build-android.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: clearwage-apks
          path: release/apks

      - name: Download iOS artifact
        if: needs.build-ios.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: clearwage-ios
          path: release/ios

      - name: Download Windows artifact
        if: needs.build-windows.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: clearwage-windows
          path: release/windows

      - name: Download macOS artifact
        if: needs.build-macos.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: clearwage-macos
          path: release/macos

      - name: Download Linux artifact
        if: needs.build-linux.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: clearwage-linux
          path: release/linux

      - name: Prepare release body from CHANGELOG
        shell: bash
        working-directory: app
        run: |
          VERSION=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          awk -v ver="[$VERSION]" '
            /^## \[/ {
              if (index($0, "## " ver) == 1) { on = 1; print; next }
              if (on) exit
            }
            on
          ' CHANGELOG.md > release-body.md

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          body_path: app/release-body.md
          allowUpdates: true
          update_release_body: true
          files: |
            release/apks/**/*.apk
            release/ios/**/*.zip
            release/windows/**/*.zip
            release/windows/**/*.exe
            release/macos/**/*.zip
            release/linux/**/*.tar.gz
          name: Release ${{ github.ref_name }}
