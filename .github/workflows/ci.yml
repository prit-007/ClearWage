name: CI

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: server

jobs:
  sqlc-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: server/go.sum
      - uses: sqlc-dev/setup-sqlc@v1
        with:
          version: 'v1.31.1'
      - name: Verify sqlc generated code is up to date
        run: |
          sqlc generate
          git diff --exit-code -- 'repositories/db/*.go'

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: server/go.sum
      - uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          working-directory: server
          args: --timeout=5m

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: server/go.sum
      - name: Run tests
        run: go test -v -count=1 ./pkg/ ./middlewares/ ./services/ ./controllers/api/v1/

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: server/go.sum
      - name: Build
        run: go build -v ./...

  flutter-analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Flutter prep
        uses: ./.github/actions/flutter-prep
      - name: Format check
        run: dart format --set-exit-if-changed lib test
        working-directory: app
      - name: Analyze
        run: flutter analyze
        working-directory: app
      - name: Test (no network)
        run: flutter test --coverage -x network
        working-directory: app

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [flutter-analyze-and-test]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Flutter prep
        uses: ./.github/actions/flutter-prep
      - name: Write Android signing config from CI secrets
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        shell: bash
        working-directory: app
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<'EOF'
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF
      - name: Extract version from pubspec
        id: version
        shell: bash
        working-directory: app
        run: |
          VER=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "code=${VER##*+}" >> "$GITHUB_OUTPUT"
      - name: Build release APKs (split-per-ABI)
        run: flutter build apk --release --split-per-abi
        working-directory: app
      - name: Build universal release APK
        run: flutter build apk --release
        working-directory: app
      - name: Extract CHANGELOG entry for this version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          VERSION="${VERSION%%+*}"
          awk -v ver="[$VERSION]" '/^## \[/ { if (index($0, "## " ver) == 1) { on=1; print; next } if (on) exit } on' CHANGELOG.md > release-body.md
        working-directory: app
      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        with:
          body_path: app/release-body.md
          files: |
            app/build/app/outputs/flutter-apk/*.apk
          fail_on_unmatched_files: false