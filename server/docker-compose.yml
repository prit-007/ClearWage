version: '3.8'

services:
  postgresdb:
    image: postgres:16-alpine
    container_name: vivek_postgres
    environment:
      POSTGRES_USER: vivek
      POSTGRES_PASSWORD: vivek_password
      POSTGRES_DB: vivek_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vivek"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    restart: always
    ports:
      - "8080:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=postgresdb
    depends_on:
      - postgresdb

volumes:
  pgdata:
